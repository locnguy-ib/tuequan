<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ if .IsHome }}
            Tuệ Quán Thiền Viện
        {{ else }}
            {{ .Title }} | Tuệ Quán Thiền Viện
        {{ end }}
    </title>

    <meta
        name="description"
        content="{{ .Site.Params.description }}"
    >

    <link
        rel="stylesheet"
        href="{{ "css/site.css" | relURL }}"
    >

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a
            class="site-title"
            href="{{ "" | relURL }}"
        >
            Tuệ Quán Thiền Viện
        </a>

        <nav class="site-nav">

            <div class="language-content vietnamese">
        
                <a href="{{ "" | relURL }}">
                    Trang chủ
                </a>
        
                <a href="{{ "events/" | relURL }}">
                    Sự kiện
                </a>
        
                <a href="{{ "blog/" | relURL }}">
                    Blog
                </a>
        
                <a href="{{ "schedule/" | relURL }}">
                    Lịch sinh hoạt
                </a>
        
                <a href="{{ "about/" | relURL }}">
                    Giới thiệu
                </a>
        
                <a href="{{ "contact/" | relURL }}">
                    Liên hệ
                </a>
        
            </div>
        
        
            <div class="language-content english">
        
                <a href="{{ "" | relURL }}">
                    Home
                </a>
        
                <a href="{{ "events/" | relURL }}">
                    Events
                </a>
        
                <a href="{{ "blog/" | relURL }}">
                    Blog
                </a>
        
                <a href="{{ "schedule/" | relURL }}">
                    Schedule
                </a>
        
                <a href="{{ "about/" | relURL }}">
                    About
                </a>
        
                <a href="{{ "contact/" | relURL }}">
                    Contact
                </a>
        
            </div>
        
        
            <span class="language-switch">
        
                <button onclick="setLanguage('vi')">
                    Tiếng Việt
                </button>
        
                |
        
                <button onclick="setLanguage('en')">
                    English
                </button>
        
            </span>
        
        </nav>

    </div>

</header>

<main class="site-main">

    {{ block "main" . }}
    {{ end }}

</main>

<footer class="site-footer">

    <div class="footer-inner">

        <p>
            {{ .Site.Params.templeName }}
        </p>

        <p>
            <a href="{{ "contact/" | relURL }}">Liên hệ / Contact</a>
        </p>

        <p>
            © {{ now.Year }} {{ .Site.Params.templeName }}
        </p>

    </div>

</footer>

<script src="{{ "js/site.js" | relURL }}"></script>

</body>

</html>
