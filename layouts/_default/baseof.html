<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ if .Title }}
            {{ .Title }} | {{ .Site.Title }}
        {{ else }}
            {{ .Site.Title }}
        {{ end }}
    </title>

    <meta name="description"
          content="{{ .Site.Params.description }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            line-height: 1.6;
            color: #333;
            background: #faf9f7;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-top: 0;
        }

        .event {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .event h2,
        .event h3 {
            margin-top: 0;
        }

        .event h2 a,
        .event h3 a {
            color: inherit;
            text-decoration: none;
        }

        .event-date {
            font-weight: 600;
        }

        .event-meta {
            color: #666;
        }

        footer {
            max-width: 1000px;
            margin: 60px auto 30px;
            padding: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: .9rem;
        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="site-title">
            {{ .Site.Title }}
        </div>

        <nav>
            <a href="{{ "/" | relURL }}">Home</a>
            <a href="{{ "/events/" | relURL }}">Events</a>
        </nav>

    </div>

</header>

<main>

    {{ block "main" . }}{{ end }}

</main>

<footer>

    © {{ now.Year }} {{ .Site.Title }}

</footer>

</body>

</html>
