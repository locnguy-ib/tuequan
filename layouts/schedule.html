{{ define "main" }}

<article class="schedule-page">

    <header class="schedule-header">

        <h1 id="scheduleTitle">
            Lịch sinh hoạt
        </h1>

        <div class="schedule-navigation">

            <button
                id="previousMonth"
                type="button"
            >
                ← Tháng trước
            </button>

            <h2 id="scheduleMonth"></h2>

            <button
                id="nextMonth"
                type="button"
            >
                Tháng sau →
            </button>

        </div>

    </header>


    <div id="monthlySchedule">

        <p>Đang tải lịch...</p>

    </div>

</article>


<script>
    window.recurringEvents =
        {{ index .Site.Data "recurring-events" | jsonify | safeJS }};

    window.specialEvents = [
        {{ range where .Site.RegularPages "Section" "events" }}
        {
            title: {{ .Title | jsonify | safeJS }},
            title_en: {{ .Params.title_en | jsonify | safeJS }},

            date: {{ .Params.date | jsonify | safeJS }},
            time: {{ .Params.time | jsonify | safeJS }},

            location: {{ .Params.location | jsonify | safeJS }},
            location_en: {{ .Params.location_en | jsonify | safeJS }},

            description: {{ .Params.description | jsonify | safeJS }},
            description_en: {{ .Params.description_en | jsonify | safeJS }},

            zoom: {{ .Params.zoom | jsonify | safeJS }},
            zoom_info: {{ .Params.zoom_info | jsonify | safeJS }},

            permalink: {{ .RelPermalink | jsonify | safeJS }}
        },
        {{ end }}
    ];
</script>


<script src="{{ "js/schedule.js" | relURL }}"></script>
<script src="{{ "js/schedule-page.js" | relURL }}"></script>

{{ end }}
